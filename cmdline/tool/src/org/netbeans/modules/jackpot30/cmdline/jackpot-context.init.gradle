// Gradle init script used by `jackpot --gradle` / `jackpot context --gradle`:
// registers a task that prints, for every project with a main Java source
// set, its source roots, release/source level and compile classpath. Run with
// --offline; it resolves nothing that is not already in the Gradle cache.
allprojects { p ->
    p.tasks.register('jackpotContext') {
        doLast {
            def ss = p.extensions.findByName('sourceSets')
            if (ss == null || ss.findByName('main') == null) return
            def main = ss.getByName('main')
            def level = null
            try {
                def jc = p.tasks.findByName('compileJava')
                if (jc != null) {
                    def r = jc.options.release.orNull
                    level = r != null ? r.toString() : jc.sourceCompatibility
                }
            } catch (Throwable t) {
            }
            println 'JACKPOT-MODULE ' + p.path
            main.java.srcDirs.each { println 'JACKPOT-ROOT ' + it.absolutePath }
            if (level != null) println 'JACKPOT-SOURCE ' + level
            main.compileClasspath.files.each { println 'JACKPOT-CP ' + it.absolutePath }
            println 'JACKPOT-END'
        }
    }
}
